[package]
name = "quati-curriculum"
version = "0.1.0"
entrypoint = "src/lib.typ"
authors = ["Gabriel Malosto <professional@gabdumal.com>"]
license = "AGPL-3.0-or-later"
description = "Modern and colorful Curriculum Vitae in Portuguese!"
repository = "https://github.com/gabdumal/quati_curriculum"
keywords = ["Modern", "Colorful", "Portuguese", "Curriculum Vitae", "CV"]
categories = ["cv"]
exclude = [
    "/.devcontainer",
    "/.git",
    "/.vscode",
    "/examples",
    "/scripts",
    "/target",
    "/.gitignore",
    "/.gitmodules",
    "/compose.yml",
    "/TODO.md",
    "/tinymist.lock",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"

[tool.utpm]
exclude = [
    ".devcontainer",
    ".git",
    ".vscode",
    "examples",
    "scripts",
    "target",
    ".gitignore",
    ".gitmodules",
    "compose.yml",
    "TODO.md",
    "tinymist.lock",
]
